<!DOCTYPE html>
<html lang="ja">
<head>

<title>ホームページを作って公開しよう | 手順書</title>
<meta name="description" content="GitHub Pagesで自分のホームページを公開するための手順書です。VSCodeをインストールする版と、ブラウザだけで進める版があります。">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <p class="eyebrow">Digital Innovator</p>

  <nav class="cards" aria-label="手順書一覧">

      <span class="card-more">手順書を読む</span>

    <a class="card" href="github-pages-browser/">
