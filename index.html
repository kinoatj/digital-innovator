<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHubとVSCodeでホームページを作って公開しよう</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
    line-height: 1.9;
    color: #1f2328;
    background: #f4f7f6;
    padding: 32px 20px;
  }
  main {
    max-width: 560px;
    width: 100%;
    background: #fff;
    border: 1px solid #d8dee4;
    border-radius: 12px;
    padding: 40px 32px;
    box-shadow: 0 2px 10px rgba(0,0,0,.05);
  }
  h1 {
    font-size: 1.5rem;
    line-height: 1.6;
    margin: 0 0 8px;
    padding-bottom: 12px;
    border-bottom: 3px solid #2f8f77;
  }
  p { color: #57606a; margin: 16px 0 28px; }
  a.button {
    display: inline-block;
    background: #2f8f77;
    color: #fff;
    text-decoration: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: 700;
  }
  a.button:hover { background: #26765f; }
  ul { padding-left: 1.3em; margin: 28px 0 0; }
  li { margin: 6px 0; }
  a { color: #1a6f96; }
</style>
</head>
<body>
<main>
  <ul>
    <li><a href="github-pages/">GitHubとVSCodeでホームページを作って公開しよう</a></li>
  </ul>
</main>
</body>
</html>
